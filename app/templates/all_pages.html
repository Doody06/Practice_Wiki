{% extends "base.html" %}
{% block title %}All Pages{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 class="page-title">All Pages</h1>
        <div class="pages-list">
            {% for page in pages %}
                <div class="page-item">
                    <div class="page-title-link">
                        <a href="{{ url_for('user.view_page', slug=page.slug) }}">{{ page.title }}</a>
                    </div>
                    {% if is_admin == True %}
                        <div class="page-actions">
                            <a href="{{ url_for('admin.edit_page', slug=page.slug) }}" class="btn btn-outline btn-sm">Edit</a>
                            <form id="delete-form-{{ page.slug }}" action="{{ url_for('admin.delete_page', slug=page.slug) }}" method="post" style="display:inline;">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-outline btn-sm" onclick="return confirm('Are you sure you want to delete this page?')">
                                    <span class="text-subtle">Delete</span>
                                </button>
                            </form>
                        </div>
                    {% endif %}
                </div>
            {% else %}
                <div class="no-pages">No pages found.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function getCSRFToken() {
    return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
}

function deletePage(slug) {
    fetch(`/delete_page/${slug}`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCSRFToken()
        }
    })
    .then(response => {
        if (response.ok) {
            window.location.reload();
        }
    });
}
</script>
{% endblock %}
